name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بنقرة زر من GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java
      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # 3. إعداد بيئة Flutter
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      # 4. تثبيت المكتبات (Dependencies)
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء ملف الـ APK (Unsigned Release)
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # 6. رفع ملف الـ APK كناتج قابل للتحميل (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
